name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Ringkasan error
        if: failure()
        run: |
          grep -E "^e: |What went wrong|Could not resolve|Execution failed|error:" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
      - run: gh release create "v1.${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Layar Live v1.${{ github.run_number }}" --notes "APK debug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
